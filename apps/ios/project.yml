name: Memoria
options:
  bundleIdPrefix: com.memoria
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO

targets:
  Memoria:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Memoria/Sources/Memoria
      - path: Memoria/App
      - path: Memoria/Resources
    settings:
      base:
        PRODUCT_NAME: Memoria
        PRODUCT_BUNDLE_IDENTIFIER: com.memoria.app
        INFOPLIST_FILE: Memoria/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  MemoriaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Memoria/Tests/MemoriaTests
    dependencies:
      - target: Memoria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.memoria.app.tests
        GENERATE_INFOPLIST_FILE: YES
