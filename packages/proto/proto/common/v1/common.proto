syntax = "proto3";

package memorycapsule.common.v1;

message PaginationRequest {
  int32 limit = 1;
  optional string cursor_time = 2;
  optional string cursor_id = 3;
}

message PaginationResponse {
  int32 total = 1;
  bool has_more = 2;
  optional string next_cursor_time = 3;
  optional string next_cursor_id = 4;
}

message ErrorDetails {
  string code = 1;
  string message = 2;
  string correlation_id = 3;
  int64 timestamp = 4;
  map<string, string> metadata = 5;
}

message EmptyRequest {}

message StatusResponse {
  bool success = 1;
  string message = 2;
}
