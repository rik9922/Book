syntax = "proto3";

package memorycapsule.media.v1;

service MediaService {
  rpc GetAssetMetadata (GetAssetMetadataRequest) returns (GetAssetMetadataResponse);
  rpc ValidateStorageAccess (ValidateStorageAccessRequest) returns (ValidateStorageAccessResponse);
}

message MediaAssetMessage {
  string id = 1;
  string space_id = 2;
  string original_name = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  string storage_key = 7;
  optional string public_url = 8;
  string derivatives_json = 9;
  string metadata_json = 10;
  string created_at = 11;
}

message GetAssetMetadataRequest {
  string asset_id = 1;
  string space_id = 2;
}

message GetAssetMetadataResponse {
  bool found = 1;
  optional MediaAssetMessage asset = 2;
}

message ValidateStorageAccessRequest {
  string space_id = 1;
  string user_id = 2;
  int64 required_bytes = 3;
}

message ValidateStorageAccessResponse {
  bool allowed = 1;
  int64 used_bytes = 2;
  int64 max_bytes = 3;
  optional string reason = 4;
}

