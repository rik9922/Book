name: Memoria CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: memoria_ci_password
          POSTGRES_DB: memory_capsule_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      IDENTITY_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      MEMORY_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      MEDIA_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      COLLAB_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      BOOK_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      COMMERCE_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      NOTIFICATION_DATABASE_URL: postgres://postgres:memoria_ci_password@127.0.0.1:5432/memory_capsule_ci
      JWT_SECRET: ci-jwt-secret-memory-capsule-2026-verify
      SESSION_SECRET: ci-session-secret-memory-capsule-2026-verify
      INTERNAL_SERVICE_KEY: ci-internal-secret-memory-capsule-2026

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install system media & OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client tesseract-ocr poppler-utils ffmpeg

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Memoria Quality Gate
        run: pnpm run check:quality

      - name: Build all workspaces
        run: pnpm build

      - name: Apply database migrations
        run: |
          for file in packages/database/migrations/*.sql; do
            PGPASSWORD=memoria_ci_password psql -h 127.0.0.1 -U postgres -d memory_capsule_ci -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Run backend & integration test suite
        run: NODE_ENV=test node --import tsx --test --test-concurrency=1 tests/*.ts

      - name: Run Web PWA E2E suite
        run: NODE_ENV=test node --import tsx --test tests/e2e/*.ts

  ios-swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift Package tests
        run: cd apps/ios/Memoria && swift test
